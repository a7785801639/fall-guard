name: Android APK

on:
  push:
    # Без branches GitHub запускал сборку только для тегов: push в main сборку не запускал
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.FG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5

      # Постоянный ключ подписи из секретов: тогда новые версии ставятся поверх старых.
      # Секреты: FG_KEYSTORE_BASE64 (base64 от .jks), FG_KEYSTORE_PASSWORD, FG_KEY_ALIAS.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          FG_KEYSTORE_BASE64: ${{ secrets.FG_KEYSTORE_BASE64 }}
        run: |
          echo "$FG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fallguard.jks"
          echo "FG_KEYSTORE_FILE=$RUNNER_TEMP/fallguard.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          FG_VERSION_CODE: ${{ github.run_number }}
          # Приложение проверяет релизы этого репозитория (только при постоянном ключе подписи)
          FG_UPDATE_REPO: ${{ github.repository }}
          FG_KEYSTORE_PASSWORD: ${{ secrets.FG_KEYSTORE_PASSWORD }}
          FG_KEY_ALIAS: ${{ secrets.FG_KEY_ALIAS }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "FallGuard-1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: fallguard-apk
          path: android/FallGuard-*.apk

      # Релиз публикуется на каждую версию приложения в main (и на теги android-v*):
      # установленное приложение находит его и предлагает обновиться.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v') || (github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="android-v1.${{ github.run_number }}"; fi
          gh release create "$TAG" android/FallGuard-*.apk --target "$GITHUB_SHA" \
            --title "FallGuard для Android ${TAG#android-v}" \
            --notes "Установите APK поверх прежней версии. Приложение со включённым автообновлением предложит это само."
