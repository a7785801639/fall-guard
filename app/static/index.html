<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0B0E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>FallGuard</title>
  <script src="/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0A0B0E; --raise: #13151A; --raise-2: #1A1D23; --fill: rgba(255, 255, 255, 0.06); --fill-2: rgba(255, 255, 255, 0.1);
      --line: rgba(255, 255, 255, 0.08); --text: #ECEEF2; --muted: #8B93A1; --faint: #5A6170;
      --calm: #3DD68C; --calm-soft: rgba(61, 214, 140, 0.14); --care: #5B9BFF; --care-soft: rgba(91, 155, 255, 0.15);
      --warn: #F5B23A; --warn-soft: rgba(245, 178, 58, 0.15); --alarm: #FF4D57; --alarm-strong: #E5343F; --alarm-soft: rgba(255, 77, 87, 0.15);
      --r: 14px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); }
    body { color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
    [hidden] { display: none !important; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
    button:disabled { opacity: 0.4; cursor: default; }
    :focus-visible { outline: 2px solid var(--care); outline-offset: 2px; }
    .num { font-variant-numeric: tabular-nums; }
    svg.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    /* ================= Каркас ================= */
    .app { padding: calc(10px + var(--safe-t)) 12px calc(20px + var(--safe-b)); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
    .layout > *, .rail > * { min-width: 0; }
    .main { min-width: 0; }
    .rail { min-width: 0; display: grid; gap: 14px; }
    .rail-spacer { display: none; }
    @media (max-width: 979px) {
      .rail { display: contents; }
      .status { order: -1; }
      .main { order: 0; }
      .inframe { order: 1; } .signal { order: 2; } .actions { order: 3; } .tools { order: 4; }
    }
    @media (min-width: 980px) {
      .app { height: 100dvh; padding: 12px; }
      .layout { display: flex; justify-content: center; gap: 12px; height: 100%; }
      /* Плеер: видео по высоте окна + полоса хроники 76 px; панель справа фиксированной ширины */
      .main { flex: none; align-self: flex-start; width: min(calc(100% - 372px), calc((100dvh - 24px - 76px) * var(--ar, 1.7778))); }
      .rail { flex: none; width: 360px; display: flex; flex-direction: column; gap: 22px; padding: 6px 4px 4px 14px; border-left: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; }
      .rail::-webkit-scrollbar { display: none; }
      .rail-spacer { display: block; flex: 1; min-height: 8px; }
    }
    .label { font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }

    /* ================= Статус (фиксированная высота) ================= */
    .status { display: flex; align-items: center; gap: 14px; height: 76px; padding: 0 14px; border-radius: var(--r); background: var(--raise); transition: background 0.25s; }
    .status-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--fill); color: var(--muted); transition: background 0.25s, color 0.25s; }
    .status-dot svg { width: 22px; height: 22px; stroke-width: 2.1; }
    .status-text { min-width: 0; flex: 1; }
    .status-title, .status-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 26px; }
    .status-sub { font-size: 13.5px; color: var(--muted); line-height: 19px; height: 19px; }
    .status[data-tone="calm"] .status-dot { background: var(--calm-soft); color: var(--calm); }
    .status[data-tone="care"] .status-dot { background: var(--care-soft); color: var(--care); }
    .status[data-tone="warn"] { background: #2A2213; }
    .status[data-tone="warn"] .status-dot { background: var(--warn); color: #2B1A00; }
    .status[data-tone="alarm"] { background: var(--alarm-strong); animation: pulse 1.2s ease-in-out infinite; }
    .status[data-tone="alarm"] .status-dot { background: #fff; color: var(--alarm-strong); }
    .status[data-tone="alarm"] .status-sub { color: rgba(255, 255, 255, 0.85); }
    @keyframes pulse { 50% { background: #C32733; } }
    .player { position: relative; }
    .app[data-alarm="1"] .player::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); box-shadow: inset 0 0 0 3px var(--alarm); pointer-events: none; animation: ring 1.2s ease-in-out infinite; z-index: 6; }
    @keyframes ring { 50% { box-shadow: inset 0 0 0 3px rgba(255, 77, 87, 0.25); } }
    @media (prefers-reduced-motion: reduce) { .status, .player::after { animation: none !important; } }

    /* ================= В кадре: две неизменные строки ================= */
    .who { display: flex; align-items: center; gap: 12px; height: 46px; }
    .who + .who { border-top: 1px solid var(--line); }
    .who i { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--faint); }
    .who[data-on="1"] i { background: var(--calm); }
    .who.vis[data-on="1"] i { background: var(--care); }
    .who b { font-weight: 600; width: 74px; flex: none; }
    .who span { flex: 1; min-width: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who[data-on="1"] span { color: var(--text); }
    .more { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; }
    .more:hover { background: var(--fill); color: var(--text); }

    /* ================= Кнопки ================= */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--fill); font-weight: 600; font-size: 15px; transition: background 0.15s, transform 0.06s; white-space: nowrap; }
    a.btn, label.btn { text-decoration: none; color: inherit; cursor: pointer; }
    .btn:hover { background: var(--fill-2); }
    .btn:active { transform: scale(0.98); }
    .btn.big { min-height: 54px; font-size: 16px; border-radius: 14px; }
    .btn.block { width: 100%; }
    .btn.solid { background: var(--text); color: var(--bg); }
    .btn.solid:hover { background: #fff; }
    .btn.primary { background: var(--calm); color: #04210F; }
    .btn.danger { background: var(--alarm-strong); color: #fff; }
    .btn.ghost { background: transparent; }
    .btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
    .btn.red-text { color: var(--alarm); }
    .btn[aria-pressed="true"] { background: var(--calm-soft); color: var(--calm); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > .btn { flex: 1; }

    .actions { display: flex; gap: 8px; height: 54px; }
    .actions .btn { flex: 1; }
    .actions .btn.narrow { flex: 0 0 76px; }

    /* Сигнал мне: сегмент с иконками */
    .seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--fill); }
    .seg button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-align: center; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--raise-2); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
    .seg.wide { display: flex; width: 100%; }
    .seg.wide button { flex: 1 1 0; min-width: 0; min-height: 42px; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
    .seg svg { width: 17px; height: 17px; }
    #modeSeg button[data-v="falls"][aria-pressed="true"] { color: var(--alarm); }
    #modeSeg button[data-v="all"][aria-pressed="true"] { color: var(--calm); }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 7px; min-height: 17px; }

    /* Инструменты: звук, журнал, настройки */
    .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; height: 62px; border-radius: 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .tool:hover { background: var(--fill); color: var(--text); }
    .tool svg { width: 22px; height: 22px; }
    .tool[aria-pressed="true"] { color: var(--calm); }

    /* ================= Плеер ================= */
    .player { background: #000; border-radius: var(--r); overflow: hidden; }
    .viewport { position: relative; width: 100%; aspect-ratio: var(--ar, 1.7778); background: #000; overflow: hidden; color: #fff; }
    .viewport video, .viewport img.live, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .viewport video, .viewport img.live { object-fit: contain; }
    .viewport canvas { pointer-events: none; }
    .viewport.drawing canvas { pointer-events: auto; cursor: crosshair; touch-action: none; }
    .viewport.hit { cursor: pointer; }
    .viewport:fullscreen { border-radius: 0; aspect-ratio: auto; }
    .vp-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
    .vp-top > * { pointer-events: auto; }
    .vp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); }
    .chip.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #FF4D57; }
    .vp-btns { display: flex; gap: 6px; }
    .vp-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(10px); }
    .vp-btn svg { width: 17px; height: 17px; }
    .vp-btn[aria-pressed="false"] { opacity: 0.5; }
    .vp-msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: #9AA3B2; background: #000; font-size: 14px; }
    .vp-msg b { display: block; color: #fff; font-size: 17px; margin-bottom: 4px; }
    .draw-bar { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 16px; border-radius: 14px; font-size: 13.5px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px); z-index: 5; }
    .draw-bar span { flex: 1; min-width: 0; }
    .draw-bar .btn.primary { background: #fff; color: #111; }
    .scrub { position: absolute; inset: 0; z-index: 4; background: #000; display: grid; place-items: center; }
    .scrub img { width: 100%; height: 100%; object-fit: contain; }
    .scrub-badge { position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); font-size: 13px; font-weight: 650; }
    .scrub-badge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--warn); }

    /* Хроника — нижняя полоса плеера */
    .timeline { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px 6px; background: #101216; }
    .timeline .seg { flex: none; margin-top: 1px; }
    .timeline .seg button { padding: 0 10px; }
    .tl-track { flex: 1; min-width: 0; }
    .ribbon-wrap { cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
    .ribbon { position: relative; height: 34px; border-radius: 8px; background: #1A1D23; }
    .ribbon-clip { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; }
    .ribbon i { position: absolute; top: 0; bottom: 0; min-width: 2px; font-style: normal; font-size: 11.5px; font-weight: 650; line-height: 34px; padding-left: 8px; white-space: nowrap; overflow: hidden; color: rgba(255, 255, 255, 0.88); box-shadow: inset -1px 0 0 #101216; }
    .ribbon i.t-calm { background: #1C5E44; }
    .ribbon i.t-caregiver { background: #2F5BA8; }
    .ribbon i.t-warn { background: #F5B23A; color: #2B1A00; }
    .ribbon i.t-alarm { background: var(--alarm-strong); min-width: 4px; }
    .ribbon i.t-paused { background: repeating-linear-gradient(135deg, #2A2E37 0 5px, #1A1D23 5px 10px); color: #9AA2B1; }
    .ribbon i.t-offline { background: transparent; color: var(--faint); }
    .ribbon b { position: absolute; top: -6px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--warn); border: 2.5px solid #101216; z-index: 2; cursor: pointer; }
    .ribbon b.fall { background: var(--alarm); width: 18px; height: 18px; margin-left: -9px; top: -8px; }
    .ribbon b::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 30px; margin-left: -1px; background: inherit; opacity: 0.6; }
    .ribbon u { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; border-radius: 2px; background: #fff; display: none; z-index: 3; text-decoration: none; }
    .ribbon u[data-t]::before { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, -3px); padding: 2px 6px; border-radius: 6px; background: #fff; color: #0B0D11; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .axis { position: relative; height: 18px; margin-top: 3px; font-size: 11.5px; color: #6B7383; }
    .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
    .axis span::before { content: ""; position: absolute; left: 50%; top: -4px; width: 1px; height: 3px; background: #3A404C; }
    .axis span.last { transform: translateX(-100%); }
    @media (max-width: 600px) { .timeline { gap: 8px; padding: 10px 10px 4px; } .timeline .seg button { padding: 0 7px; font-size: 12px; } }
    .tip { position: fixed; z-index: 50; width: 196px; padding: 8px 8px 10px; border-radius: 12px; pointer-events: none; background: var(--raise-2); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5); font-size: 13px; }
    .tip img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--fill); display: block; margin-bottom: 7px; }

    /* ================= Меню действий ================= */
    .menu { position: fixed; z-index: 55; min-width: 220px; max-width: 280px; padding: 6px; border-radius: 14px; background: var(--raise-2); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--line); }
    .menu-title { padding: 8px 10px 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .menu button { display: block; width: 100%; padding: 10px; border-radius: 9px; font-size: 14.5px; font-weight: 550; }
    .menu button:hover { background: var(--fill); }
    .menu button.on { color: var(--calm); }
    .menu button.danger { color: var(--alarm); }

    /* ================= Листы: журнал и настройки ================= */
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .scrim > * { min-width: 0; justify-self: center; }
    .sheet { background: var(--raise); display: flex; flex-direction: column; min-height: 0; width: 100%; height: 100%; padding-top: var(--safe-t); }
    @media (min-width: 760px) {
      .scrim { place-items: center; padding: 28px; }
      .sheet { width: min(820px, 100%); height: min(800px, 100%); border-radius: 20px; padding-top: 0; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, 0.5); }
    }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 6px 20px; }
    .sheet-head h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; flex: 1; min-width: 0; }
    .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); flex: none; }
    .tabs { display: flex; gap: 4px; padding: 8px 16px 12px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { min-height: 34px; padding: 0 14px; border-radius: 999px; white-space: nowrap; font-weight: 600; font-size: 14px; color: var(--muted); }
    .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 18px 16px calc(28px + var(--safe-b)); display: grid; gap: 26px; align-content: start; -webkit-overflow-scrolling: touch; }
    @media (min-width: 760px) { .sheet-body, .tabs { padding-left: 20px; padding-right: 20px; } }
    .group h3 { margin: 0 0 4px; font-size: 16px; font-weight: 650; }
    .group > p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
    .rows { display: grid; border-radius: 14px; overflow: hidden; background: var(--raise-2); }
    .rowi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; min-height: 56px; }
    .rowi + .rowi { border-top: 1px solid var(--line); }
    .rowi-body { flex: 1 1 170px; min-width: 0; }
    .rowi-title { font-weight: 600; }
    .rowi-sub { color: var(--muted); font-size: 13px; }
    .rowi-actions { display: flex; align-items: center; gap: 8px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
    .switch { width: 46px; height: 28px; border-radius: 999px; background: var(--fill-2); position: relative; flex: none; transition: background 0.18s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform 0.18s; }
    .switch[aria-checked="true"] { background: var(--calm); }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }
    select, input[type="number"], input[type="text"] { min-height: 38px; padding: 0 10px; border-radius: 9px; background: var(--fill); border: 0; max-width: 100%; }
    select option { background: var(--raise-2); }
    input[type="number"] { width: 88px; }
    .badge { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; background: var(--fill); color: var(--muted); white-space: nowrap; }
    .badge.alarm { background: var(--alarm-soft); color: var(--alarm); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.calm { background: var(--calm-soft); color: var(--calm); }
    .empty { color: var(--muted); padding: 8px 0; font-size: 14px; }
    .faces { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 12px; }
    .face { position: relative; width: 66px; height: 66px; }
    .face img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; background: var(--fill-2); }
    .face button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 12px; line-height: 22px; text-align: center; }
    .pair { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 22px 16px; border-radius: 14px; background: var(--raise-2); margin-top: 12px; }
    .pair .qr { width: 212px; height: 212px; padding: 10px; background: #fff; color: #000; border-radius: 14px; }
    .pair .qr svg { width: 100%; height: 100%; display: block; }
    .pair code { font: 700 28px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em; }
    .stats-line { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
    .stats-line b { color: var(--text); }
    /* Журнал */
    .list { display: grid; gap: 2px; }
    .item { display: flex; align-items: center; gap: 14px; padding: 8px; margin: 0 -8px; border-radius: 12px; width: calc(100% + 16px); min-width: 0; }
    button.item:hover { background: var(--fill); }
    .item img.thumb, .item .thumb-ph { width: 112px; height: 63px; border-radius: 9px; object-fit: cover; background: var(--fill); flex: none; }
    .item-body { min-width: 0; flex: 1; }
    .item-title, .item-sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-title { font-weight: 600; }
    .item-title.fall { color: var(--alarm); }
    .item-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .day { font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding: 12px 0 4px; }
    .logrow { display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: 14px; }
    .logrow + .logrow { border-top: 1px solid var(--line); }
    .logrow time { color: var(--faint); flex: none; width: 44px; }
    .logrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); flex: none; }
    .logrow.warning::before { background: var(--warn); }
    .logrow.critical::before { background: var(--alarm); }

    /* ================= Запись события ================= */
    .clip { background: var(--raise); width: 100%; height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-t); }

  /* ---------- Хроника под видео ---------- */
  const TONE_LABEL = { calm: "спокойно", caregiver: "родственник", paused: "пауза", offline: "нет связи", alarm: "падение" };
  let thumbs = [];
  function setWindow(sec) {
    windowSec = sec; lsSet("fg_win", String(sec));
    [...$("winSeg").children].forEach((b, i) => b.setAttribute("aria-pressed", String((i === 0) === (sec === 21600))));
    poll();
  }
  function renderTimeline(tl) {
    if (!tl) return;
    const rb = $("ribbon"), W = rb.clientWidth || 600;
    const start = tl.start_ts, win = tl.window_sec || windowSec;
    let html = `<div class="ribbon-clip">`;
    for (const sp of tl.spans || []) {
      const l = Math.max(0, (sp.start - start) / win * 100), w = Math.min(100 - l, (sp.end - Math.max(sp.start, start)) / win * 100);
      if (w <= 0) continue;
      const txt = sp.tone === "warn" ? String(sp.label || "").toLowerCase() : (TONE_LABEL[sp.tone] || "");
      const fits = (w / 100) * W > txt.length * 6.6 + 14;
      html += `<i class="t-${esc(sp.tone)}" style="left:${l.toFixed(3)}%;width:${Math.max(0.15, w).toFixed(3)}%">${fits ? esc(txt) : ""}</i>`;
    }
    html += `</div><u id="ribbonCursor"></u>`;
    for (const c of clips) {
      const p = (c.ts - start) / win * 100;
      if (p >= 0 && p <= 100 && !c.false_alarm) html += `<b class="${c.state === "fallen" ? "fall" : ""}" style="left:${p.toFixed(3)}%" title="${esc(c.title)}"></b>`;
    }
    if (rb._h !== html && !rb._busy) { rb._h = html; rb.innerHTML = html; }
    rb._tl = tl;
    // Часовые отметки: шаг 1 ч для 6 ч, 3 ч для суток; не теснее 70 px
    let step = win <= 21600 ? 3600 : 10800;
    while ((step / win) * W < 70) step *= 2;
    let ax = "";
    const first = Math.ceil(start / step) * step;
    for (let t = first; t < start + win; t += step) {
      const p = (t - start) / win * 100;
      if (p > 4 && (100 - p) / 100 * W > 64) ax += `<span style="left:${p.toFixed(2)}%">${clock(t)}</span>`;
    }
    ax += `<span class="last" style="left:100%">сейчас</span>`;
    setHtml($("axis"), ax);
  }
  window.addEventListener("resize", () => { if (S) { $("ribbon")._h = null; renderTimeline(S.timeline); } });

  (function timelineControls() {
    const rb = $("ribbon"), tip = $("tip"), wrap = $("ribbonWrap"), scrub = $("scrub"), scrubImg = $("scrubImg");
    const cache = new Map();
    let drag = null, tipTimer = 0;
    function at(e) {
      const tl = rb._tl; if (!tl) return null;
      const r = rb.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      return { ts: tl.start_ts + f * tl.window_sec, f, r, tl, x: e.clientX };
    }
    function clipNear(h) {
      const tol = (12 / h.r.width) * h.tl.window_sec;
      let best = null, bd = tol;
      for (const c of clips) { const d = Math.abs(c.ts - h.ts); if (d <= bd && !c.false_alarm) { best = c; bd = d; } }
      return best;
    }
    function thumbNear(ts) {
      if (!thumbs.length) return null;
      let lo = 0, hi = thumbs.length - 1;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (thumbs[mid].ts < ts) lo = mid + 1; else hi = mid; }
      const c = thumbs[lo], p = thumbs[lo - 1];
      return p && Math.abs(p.ts - ts) < Math.abs(c.ts - ts) ? p : c;
    }
    function thumbUrl(ts, clip) {
      if (clip && clip.jpg_url) return withAuth(clip.jpg_url);
      const t = thumbNear(ts);
      return t ? withAuth("/api/timeline/thumb/" + encodeURIComponent(t.id) + ".jpg") : withAuth("/api/timeline/thumb?ts=" + ts.toFixed(0));
    }
    function preload(url) { if (!cache.has(url)) { const im = new Image(); im.src = url; cache.set(url, im); if (cache.size > 120) cache.delete(cache.keys().next().value); } }
    function cursor(h, withTime) {
      const cur = $("ribbonCursor"); if (!cur) return;
      cur.style.display = "block"; cur.style.left = h.f * 100 + "%";
      if (withTime) cur.dataset.t = clock(h.ts); else delete cur.dataset.t;
    }
    function label(h, clip) {
      const sp = (h.tl.spans || []).find((s) => h.ts >= s.start && h.ts <= s.end);
      return clip ? clip.title : sp ? sp.label : "нет данных";
    }
    function hover(h) {
      cursor(h);
      const clip = clipNear(h);
      $("tipText").innerHTML = `<b class="num">${clock(h.ts)}</b> · ${esc(label(h, clip))}${clip ? "<br><span class='muted'>нажмите, чтобы открыть запись</span>" : ""}`;
      tip.hidden = false;
      tip.style.visibility = "hidden";
      tip.style.left = Math.max(8, Math.min(window.innerWidth - 204, h.x - 98)) + "px";
      tip.style.top = Math.max(8, h.r.top - tip.offsetHeight - 14) + "px";
      tip.style.visibility = "visible";
      clearTimeout(tipTimer);
      tipTimer = setTimeout(() => { $("tipImg").src = thumbUrl(h.ts, clip); }, 70);
    }
    function showScrub(h) {
      cursor(h, true);
      const clip = clipNear(h), url = thumbUrl(h.ts, clip);
      preload(url);
      if (scrubImg.getAttribute("src") !== url) scrubImg.src = url;
      $("scrubBadge").textContent = "Запись " + clock(h.ts) + " · " + label(h, clip);
      scrub.hidden = false;
    }
    function endAll() {
      rb._busy = false; tip.hidden = true; scrub.hidden = true;
      const cur = $("ribbonCursor"); if (cur) cur.style.display = "none";
    }
    wrap.addEventListener("pointerdown", (e) => {
      const h = at(e); if (!h) return;
      wrap.setPointerCapture(e.pointerId);
      rb._busy = true; tip.hidden = true;
      drag = { x0: e.clientX, moved: false, h };
      showScrub(h);
    });
    wrap.addEventListener("pointermove", (e) => {
      const h = at(e); if (!h) return;
      if (drag) {
        if (Math.abs(e.clientX - drag.x0) > 6) drag.moved = true;
        drag.h = h; showScrub(h);
      } else if (e.pointerType === "mouse") { rb._busy = true; hover(h); }
    });
    function finish(e, cancelled) {
      if (!drag) return;
      const d = drag; drag = null;
      endAll();
      if (!cancelled && !d.moved) { const c = clipNear(d.h); if (c) openClip(c.id); }
    }
    wrap.addEventListener("pointerup", (e) => finish(e, false));
    wrap.addEventListener("pointercancel", (e) => finish(e, true));
    wrap.addEventListener("pointerleave", () => { if (!drag) endAll(); });
    $("tipImg").addEventListener("error", () => { $("tipImg").removeAttribute("src"); });
  })();

  function statsHtml(care) {

  function dayLabel(ts) {

  function journalHtml() {
    const seg = `<div class="seg">${[["alerts", "Тревоги"], ["log", "Все события"]].map(([v, l]) => `<button aria-pressed="${journalView === v}" onclick="journalView='${v}';renderSheet()">${l}</button>`).join("")}</div>`;

        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Глубина</div></div><input type="number" id="inFloorD" min="40" max="1000" value="${Math.round(z.floor_depth_cm)}" /></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Высота матраса</div></div><input type="number" id="inMatH" min="15" max="140" value="${Math.round(z.mattress_height_cm)}" /></div>
      </div><button class="btn block" style="margin-top:10px" onclick="saveDims()">Сохранить размеры</button></div>`;
    const rot = Number(cam.rotate) || 0;
    h += `<div class="group"><h3>Камера</h3><div class="rows">
        <div class="rowi" style="flex-wrap:wrap"><div class="rowi-body"><div class="rowi-title">Поворот кадра</div></div><div class="seg">${[0, 90, 180, 270].map((r) => `<button aria-pressed="${rot === r}" onclick="setCam({rotate:${r}})">${r}°</button>`).join("")}</div></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Зеркально</div></div>${sw(cam.flip_h, `setCam({flip_h:${!cam.flip_h}})`, "Зеркально")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Обработка</div><div class="rowi-sub num">${esc(techLine || "—")}</div></div></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Осветлять тёмный кадр</div><div class="rowi-sub">Помогает видеть ночью и в сумерках</div></div>${sw(cam.enhance, `setCam({enhance:${!cam.enhance}})`, "Осветление")}</div>
      </div></div>`;
    return h;
  }
  async function clearZone(payload) { if (confirm("Убрать эту зону?")) await pushZones(payload, "Зона убрана"); }
  async function clearIgnore() { if (!confirm("Убрать все игнор-зоны?")) return; const d = await call("/api/zones/ignore", { method: "DELETE" }, "Игнор-зоны убраны"); if (d && d.zones) { zones = d.zones; draw(); renderSheet(); } }
  async function saveDims() {
    const clamp = (id, lo, hi, def) => Math.max(lo, Math.min(hi, Number($(id).value) || def));
    await pushZones({ floor_width_cm: clamp("inFloorW", 40, 1000, 200), floor_depth_cm: clamp("inFloorD", 40, 1000, 120), mattress_height_cm: clamp("inMatH", 15, 140, 55) }, "Размеры сохранены");
  }
  async function setCam(patch) { const d = await call("/api/camera", { json: patch }); if (d) { cam = Object.assign(cam, d.camera || d); layout(); renderSheet(); } }

  function tabPeople() {
    const faces = S.faces || {}, tracks = (live && live.tracks) || S.tracks || [];
    const gal = (role, title, sub) => {
      const arr = faces[role] || [];
      return `<div class="group"><h3>${title}</h3><p>${sub}</p>
        <div class="faces">${arr.map((fn) => `<span class="face"><img loading="lazy" alt="" src="${esc(withAuth("/api/faces/" + role + "/photo/" + encodeURIComponent(fn)))}" /><button onclick="removeFace('${role}','${esc(fn)}')" aria-label="Удалить фото">✕</button></span>`).join("") || `<span class="muted small">Фото пока нет</span>`}</div>
        <div class="row"><button class="btn" onclick="captureFace('${role}')">Снять с камеры сейчас</button><label class="btn">Загрузить фото<input type="file" accept="image/*" hidden onchange="uploadFace('${role}',this)" /></label></div></div>`;
    };
    let h = `<div class="group"><h3>Кто сейчас в кадре</h3><p>Если система перепутала — поправьте: она запомнит одежду и лицо. То же можно сделать, нажав на человека прямо на видео.</p>`;
    const real = tracks.filter((t) => Number(t.track_id) >= 0 && !t.virtual_presence && Array.isArray(t.bbox));
    h += real.length ? `<div class="rows">` + real.map((t) => {
      const id = Number(t.track_id);
      return `<div class="rowi" style="flex-wrap:wrap"><div class="rowi-body"><div class="rowi-title">${t.role === "patient" ? "Бабушка" : t.role === "visitor" ? "Свой" : "Не определён"}</div><div class="rowi-sub">${esc(t.reason_ru || "")}</div></div>
        <div class="rowi-actions"><button class="btn sm" aria-pressed="${t.role === "patient"}" onclick="assign(${id},'patient')">Бабушка</button><button class="btn sm" aria-pressed="${t.role === "visitor"}" onclick="assign(${id},'visitor')">Свой</button><button class="btn sm ghost" onclick="ignoreThing(${id})">Вещь</button></div></div>`;
    }).join("") + `</div>` : `<div class="empty">В кадре никого не видно</div>`;
    const flags = [];
    if (S.door_visit_active) flags.push(`<div class="rowi"><div class="rowi-body"><div class="rowi-title">Отмечен визит родственника</div><div class="rowi-sub">Пока идёт визит, посадка и выход из кровати не сигналят</div></div><button class="btn sm" onclick="act('/api/door_visit/clear','Отмечено: родственник вышел')">Он вышел</button></div>`);
    if (S.patient_in_bed_latched) flags.push(`<div class="rowi"><div class="rowi-body"><div class="rowi-title">Считается, что бабушка в кровати</div><div class="rowi-sub">Даже если под одеялом её не видно</div></div><button class="btn sm" onclick="act('/api/bed_presence/clear','Отмечено: в кровати никого нет')">Её там нет</button></div>`);
    if (flags.length) h += `<div class="rows" style="margin-top:10px">${flags.join("")}</div>`;
    h += `</div>`
      + gal("patient", "Фото бабушки", "2–4 фото лица анфас и вполоборота. Главный способ не путать её с родственниками.")
      + gal("visitor", "Фото своих", "Родственники и сиделка. Когда они рядом, система не поднимает тревогу о подъёме.")
      + `<div class="group"><h3>Если роли путаются постоянно</h3><p>Сброс заставит систему заново запомнить, как выглядит бабушка и в какой позе она спит.</p><div class="row"><button class="btn" onclick="act('/api/reset-anchor','Память о внешности сброшена')">Забыть внешность</button><button class="btn" onclick="act('/api/recalibrate-baseline','Поза сна будет снята заново')">Переснять позу сна</button></div></div>`;
    return h;
  }
  async function captureFace(role) { if (await call("/api/faces/" + role + "/from-camera", { json: {} }, "Лицо сохранено")) poll(); }
  async function uploadFace(role, input) {
    if (!input.files || !input.files[0]) return;
    const fd = new FormData(); fd.append("file", input.files[0]);
    input.value = "";
    if (await call("/api/faces/" + role, { method: "POST", body: fd }, "Фото добавлено")) poll();
  }
  async function removeFace(role, fn) { if (await call("/api/faces/" + role + "/" + encodeURIComponent(fn), { method: "DELETE" })) poll(); }

  function tabCare() {
    const p = S.prefs || {}, diag = (S.care && S.care.diagnostics) || {};
    const preset = p.sensitivity_preset || "standard";
    const opt = (cur, list) => list.map(([v, l]) => `<option value="${v}" ${Number(cur) === v ? "selected" : ""}>${l}</option>`).join("");
    return `<div class="group"><h3>Как быстро поднимать тревогу</h3><p>«Быстро» — раньше предупреждает, но чаще ошибается. «Спокойно» — реже беспокоит по пустякам.</p>
        <div class="seg wide">${[["high", "Быстро"], ["standard", "Обычно"], ["gentle", "Спокойно"]].map(([v, l]) => `<button aria-pressed="${preset === v}" onclick="setPrefs({sensitivity_preset:'${v}'})">${l}</button>`).join("")}</div>
        <div class="muted small" style="margin-top:8px">Падение подтверждается за ${esc(p.fall_confirm_seconds)} с, посадка — за ${esc(diag.effective_sit_confirm_sec ?? p.sit_confirm_seconds)} с${diag.night_active ? " (сейчас ночной режим)" : ""}</div></div>
      <div class="group"><h3>О чём сигналить</h3><div class="rows">
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Любой человек на полу</div><div class="rowi-sub">Тревога, если кто-то неподвижно лежит на полу и рядом никого — даже если система не узнала бабушку</div></div>${sw(p.floor_safety_net !== false, `setPrefs({floor_safety_net:${p.floor_safety_net === false}})`, "Любой человек на полу")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Поднятая рука — зов на помощь</div><div class="rowi-sub">Если бабушка держит руку над головой ${esc(p.help_confirm_seconds)} с</div></div>${sw(p.enable_help_gesture, `setPrefs({enable_help_gesture:${!p.enable_help_gesture}})`, "Жест рукой")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Ночью реагировать быстрее</div><div class="rowi-sub">С ${pad(p.night_start_hour ?? 22)}:00 до ${pad(p.night_end_hour ?? 7)}:00</div></div>${sw(p.night_strict_mode, `setPrefs({night_strict_mode:${!p.night_strict_mode}})`, "Ночной режим")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Долго нет в кровати</div><div class="rowi-sub">Повторная тревога, если не вернулась</div></div><select onchange="setPrefs({prolonged_absence_minutes:Number(this.value)})">${opt(p.prolonged_absence_minutes, [[0, "Выкл"], [10, "10 мин"], [15, "15 мин"], [20, "20 мин"], [30, "30 мин"], [45, "45 мин"], [60, "1 час"]])}</select></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Напоминать сменить позу</div><div class="rowi-sub">Профилактика пролежней</div></div><select onchange="setPrefs({immobility_reminder_minutes:Number(this.value)})">${opt(p.immobility_reminder_minutes, [[0, "Выкл"], [120, "Каждые 2 ч"], [180, "Каждые 3 ч"], [240, "Каждые 4 ч"]])}</select></div>
      </div><p class="muted small" style="margin-top:8px">Режим «только падение и сползание» каждый получатель включает себе сам — на главном экране или во вкладке «Кому сигналить».</p></div>`;
  }
  async function setPrefs(patch) { const d = await call("/api/prefs", { json: patch }); if (d && S) { S.prefs = d.prefs; S.care = d.care || S.care; renderSheet(); } }

  function renderSheet() {
    if ($("sheetScrim").hidden || !S) return;
    const active = document.activeElement;
    if (active && $("sheetBody").contains(active) && /^(INPUT|SELECT)$/.test(active.tagName)) return;
    const html = sheetMode === "journal" ? journalHtml() : ({ recipients: tabRecipients, zones: tabZones, people: tabPeople, care: tabCare }[activeTab] || tabRecipients)();
    setHtml($("sheetBody"), html);
  }

  /* ---------- Опрос и запуск ---------- */
  async function refreshMe() {
    try {
      const r = await api("/api/me");
      if (r.ok) { const d = await r.json(); if (d.me && d.me.kind !== "lan") me = d.me; else if (d.me) me = Object.assign(d.me, { mode: lsGet("fg_mode", "all") }); }
    } catch (_) {}
    renderMode();
    await poll();
  }
  let pollBusy = false;
  async function poll() {
    if (!started || pollBusy) return;
    pollBusy = true;
    try {
      const r = await api("/api/status?window_sec=" + windowSec);
      if (r.status === 401) { showLock(); return; }
      if (!r.ok) return;
      S = await r.json();
      if (S.zones && !drawMode) zones = S.zones;
      if (S.camera) cam = Object.assign(cam, S.camera);
      clips = S.recent_clips || [];
      if (Array.isArray(S.thumbs)) thumbs = S.thumbs.slice().sort((x, y) => x.ts - y.ts);
      if (!live || !tws || tws.readyState !== 1) live = Object.assign({}, S);
      if (me.kind === "telegram") { const mine = (S.telegram_subscribers || []).find((s) => String(s.chat_id) === me.id); if (mine) { me.mode = mine.mode; me.enabled = mine.enabled; } }
      if (me.kind === "device") { const mine = (S.devices || []).find((d) => d.id === me.id); if (mine) { me.mode = mine.mode; me.enabled = mine.enabled; } }
      renderMode(); renderFast(); renderTimeline(S.timeline); renderSheet(); draw();
      techLine = [S.runtime, (S.infer_fps || 0).toFixed(1) + " кадр/с", cam.resolution && cam.resolution[0] ? cam.resolution.join("×") : "", mjpeg ? "MJPEG" : "H.264"].filter(Boolean).join(" · ");
      if (pendingClip && clips.some((c) => c.id === pendingClip)) { const id = pendingClip; pendingClip = ""; openClip(id); }
    } catch (_) {} finally { pollBusy = false; }
  }

  function showLock(text, bot) {
    const b = String(bot || (S && S.telegram_bot_username) || "").replace(/^@+/, "");
    if (text) $("lockText").textContent = text;
    $("lockLink").href = "https://t.me/" + encodeURIComponent(b);
    $("lockLink").hidden = !b;
    $("lock").hidden = false;
    $("app").hidden = true;
  }
  function syncBack() {
    const t = tg(); if (!t || !t.BackButton) return;
    try { ($("sheetScrim").hidden && $("clipScrim").hidden) ? t.BackButton.hide() : t.BackButton.show(); } catch (_) {}
  }
  function goBack() {
    if (!$("clipScrim").hidden) { closeClip(); return true; }
    if (!$("menu").hidden) { hideMenu(); return true; }
    if (!$("sheetScrim").hidden) { closeSheet(); return true; }
    if (drawMode) { cancelDraw(); return true; }
    return false;
  }
  window.fallguardBack = goBack; // Android: кнопка «Назад»
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") goBack(); });

  let pendingClip = "";
  async function start(startParam) {
    if (started) return;
    started = true;
    $("lock").hidden = true; $("app").hidden = false;
    const sp = String(startParam || "");
    if (sp.startsWith("clip_")) pendingClip = sp.slice(5);
    [...$("winSeg").children].forEach((b, i) => b.setAttribute("aria-pressed", String((i === 0) === (windowSec === 21600))));
    $("btnOverlay").setAttribute("aria-pressed", String(showOverlay));
    syncSoundBtn();
    startStream(true);
    connectTelemetry();
    await refreshMe();
    setInterval(poll, 2500);
    if ("serviceWorker" in navigator && !tg()?.initData && !native) navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  async function boot() {
    const params = new URLSearchParams(location.search);
    const t = tg(), initData = (t && typeof t.initData === "string") ? t.initData.trim() : "";
    if (initData) {
      try { t.ready(); t.expand(); t.setHeaderColor("#0A0B0E"); t.setBackgroundColor("#0A0B0E"); t.disableVerticalSwipes && t.disableVerticalSwipes(); t.BackButton && t.BackButton.onClick(goBack); } catch (_) {}
      try {
        const r = await fetch("/api/tg/auth", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ init_data: initData }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.authenticated !== false) { token = String(d.session_token || ""); return start(d.start_param || (t.initDataUnsafe && t.initDataUnsafe.start_param) || ""); }
        return showLock(d.detail || "Доступ к пульту есть только у участников семейного бота.", d.bot_username);
      } catch (_) { return showLock("Не удалось проверить вход через Telegram. Проверьте связь и откройте пульт заново."); }
    }
    try {
      const r = await fetch("/api/tg/session", { credentials: "same-origin" });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.authenticated === false) return showLock("", d.bot_username);
      if (r.status === 401 || r.status === 403) return showLock(d.detail || "", d.bot_username);
      token = String(d.session_token || "");
    } catch (_) {}
    start(params.get("tgWebAppStartParam") || params.get("clip") || "");
  }
  boot();
  </script>
</body>
</html>
