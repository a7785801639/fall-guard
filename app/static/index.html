<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0C10" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <title>FallGuard</title>
  <script src="/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0A0C10;
      --surface: #12151B;
      --surface-2: #191D25;
      --surface-3: #222732;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #ECEFF4;
      --muted: #8D95A5;
      --faint: #5E6675;
      --calm: #34D399;
      --calm-bg: rgba(52, 211, 153, 0.12);
      --care: #60A5FA;
      --care-bg: rgba(96, 165, 250, 0.13);
      --warn: #FBBF24;
      --warn-bg: rgba(251, 191, 36, 0.13);
      --alarm: #F87171;
      --alarm-strong: #E5484D;
      --alarm-bg: rgba(229, 72, 77, 0.16);
      --radius: 18px;
      --radius-sm: 12px;
      --tap: 52px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }
    [hidden] { display: none !important; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { opacity: 0.5; cursor: default; }
    :focus-visible { outline: 2px solid var(--care); outline-offset: 2px; }
    .num { font-variant-numeric: tabular-nums; }
    svg.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- Каркас ---------- */
    .app {
      max-width: 1320px;
      margin: 0 auto;
      padding: calc(10px + var(--safe-t)) 14px calc(20px + var(--safe-b));
      display: grid;
      gap: 12px;
    }
    .top { display: flex; align-items: center; gap: 12px; min-height: 48px; }
    .status { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .status-dot {
      width: 12px; height: 12px; border-radius: 50%; flex: none;
      background: var(--calm); box-shadow: 0 0 0 5px var(--calm-bg);
      transition: background 0.25s, box-shadow 0.25s;
    }
    .status[data-tone="care"] .status-dot { background: var(--care); box-shadow: 0 0 0 5px var(--care-bg); }
    .status[data-tone="warn"] .status-dot { background: var(--warn); box-shadow: 0 0 0 5px var(--warn-bg); }
    .status[data-tone="alarm"] .status-dot { background: var(--alarm-strong); box-shadow: 0 0 0 5px var(--alarm-bg); animation: pulse 1s ease-in-out infinite; }
    .status[data-tone="offline"] .status-dot { background: var(--faint); box-shadow: 0 0 0 5px rgba(255,255,255,0.05); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(229, 72, 77, 0.05); } }
    .status-text { min-width: 0; }
    .status-title { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; flex: none;
      display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--line); color: var(--text);
    }
    .icon-btn:active { background: var(--surface-2); }

    .layout { display: grid; gap: 12px; }
    .col { display: grid; gap: 12px; align-content: start; min-width: 0; }
    @media (min-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
      .app { padding-left: 20px; padding-right: 20px; }
    }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    /* ---------- Видео ---------- */
    .viewport {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 74vh;
      background: #05060A; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--line);
    }
    .viewport video, .viewport img.live, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .viewport video, .viewport img.live { object-fit: contain; background: #05060A; }
    .viewport canvas { pointer-events: none; }
    .viewport.drawing canvas { pointer-events: auto; cursor: crosshair; touch-action: none; }
    .viewport:fullscreen { border-radius: 0; border: 0; max-height: none; aspect-ratio: auto; }
    .vp-top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
    .vp-top > * { pointer-events: auto; }
    .vp-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
      border-radius: 999px; font-size: 12px; font-weight: 550;
      background: rgba(10, 12, 16, 0.72); border: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    .vp-btns { display: flex; gap: 6px; }
    .vp-btn {
      width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
      background: rgba(10, 12, 16, 0.72); border: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    .vp-btn[aria-pressed="true"] { color: var(--calm); border-color: rgba(52, 211, 153, 0.4); }
    .vp-msg {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      padding: 24px; color: var(--muted); background: #05060A;
    }
    .vp-msg b { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }
    .draw-bar {
      position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px;
      padding: 8px 8px 8px 14px; border-radius: 14px; font-size: 13px;
      background: rgba(10, 12, 16, 0.88); border: 1px solid var(--line-strong); backdrop-filter: blur(10px);
    }
    .draw-bar span { flex: 1; min-width: 0; }

    /* ---------- Люди в кадре ---------- */
    .people { display: flex; flex-wrap: wrap; gap: 8px; }
    .person {
      display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 12px;
      border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; text-align: left;
    }
    .person i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
    .person[data-role="patient"] i { background: var(--calm); }
    .person[data-role="visitor"] i { background: var(--care); }
    .person[aria-expanded="true"] { border-color: var(--line-strong); background: var(--surface-2); }
    .person small { color: var(--muted); font-size: 12.5px; }
    .person-actions { flex-basis: 100%; display: flex; gap: 8px; flex-wrap: wrap; }

    /* ---------- Кнопки ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 0 16px; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--line); font-weight: 580; font-size: 14.5px; text-align: center;
      transition: background 0.15s, transform 0.05s;
    }
    a.btn, label.btn { text-decoration: none; color: inherit; cursor: pointer; }
    .btn:active { transform: scale(0.985); background: var(--surface-3); }
    .btn.big { min-height: var(--tap); font-size: 16px; border-radius: 15px; }
    .btn.block { width: 100%; }
    .btn.primary { background: var(--calm); color: #062415; border-color: transparent; }
    .btn.primary:active { background: #2BBF88; }
    .btn.danger { background: var(--alarm-strong); color: #fff; border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
    .btn.red-text { color: var(--alarm); }
    .btn[aria-pressed="true"] { background: var(--calm-bg); border-color: rgba(52, 211, 153, 0.45); color: var(--calm); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > .btn { flex: 1; }

    /* ---------- Тревога ---------- */
    .alarmcard {
      border-radius: var(--radius); padding: 16px; display: grid; gap: 12px;
      background: var(--warn-bg); border: 1px solid rgba(251, 191, 36, 0.4);
    }
    .alarmcard[data-level="alarm"] { background: var(--alarm-bg); border-color: rgba(229, 72, 77, 0.6); animation: alarm-glow 1.2s ease-in-out infinite; }
    @keyframes alarm-glow { 50% { box-shadow: 0 0 0 4px rgba(229, 72, 77, 0.18); } }
    .alarm-title { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
    .alarmcard[data-level="alarm"] .alarm-title { color: #FFD9DA; }
    .alarm-desc { color: var(--text); opacity: 0.85; }
    @media (prefers-reduced-motion: reduce) { .alarmcard, .status-dot { animation: none !important; } }

    /* ---------- Режим «только падения» ---------- */
    .mode {
      display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
      padding: 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
    }
    .mode[aria-checked="true"] { border-color: rgba(52, 211, 153, 0.45); background: linear-gradient(0deg, var(--calm-bg), var(--calm-bg)), var(--surface); }
    .mode-body { flex: 1; min-width: 0; }
    .mode-title { font-weight: 640; font-size: 16px; }
    .mode-sub { color: var(--muted); font-size: 13px; }
    .switch { width: 50px; height: 30px; border-radius: 999px; background: var(--surface-3); position: relative; flex: none; transition: background 0.18s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #C9CFDA; transition: transform 0.18s, background 0.18s; }
    [aria-checked="true"] > .switch, .switch[aria-checked="true"] { background: var(--calm); }
    [aria-checked="true"] > .switch::after, .switch[aria-checked="true"]::after { transform: translateX(20px); background: #fff; }

    /* ---------- Хроника ---------- */
    .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
    .seg button { min-height: 28px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
    .seg.wide { display: flex; }
    .seg.wide button { flex: 1; min-height: 38px; font-size: 14px; }
    .ribbon { position: relative; height: 34px; border-radius: 9px; background: var(--surface-2); overflow: hidden; touch-action: pan-y; cursor: pointer; }
    .ribbon i { position: absolute; top: 0; bottom: 0; min-width: 1px; }
    .ribbon i.t-calm { background: rgba(52, 211, 153, 0.5); }
    .ribbon i.t-caregiver { background: rgba(96, 165, 250, 0.6); }
    .ribbon i.t-warn { background: rgba(251, 191, 36, 0.85); }
    .ribbon i.t-alarm { background: var(--alarm-strong); }
    .ribbon i.t-paused { background: repeating-linear-gradient(135deg, rgba(255,255,255,0.16) 0 4px, transparent 4px 8px); }
    .ribbon i.t-offline { background: rgba(255, 255, 255, 0.05); }
    .ribbon b { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; border: 2px solid var(--bg); }
    .ribbon b.fall { background: var(--alarm-strong); border-color: #fff; }
    .ribbon u { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; display: none; }
    .axis { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; color: var(--faint); }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: currentColor; }
    .tip {
      position: fixed; z-index: 50; width: 190px; padding: 8px; border-radius: 12px; pointer-events: none;
      background: var(--surface-3); border: 1px solid var(--line-strong); box-shadow: 0 12px 32px rgba(0,0,0,0.5); font-size: 12.5px;
    }
    .tip img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: #05060A; display: block; margin-bottom: 6px; }
    .stats { display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .stat b { display: block; font-size: 16px; font-weight: 650; white-space: nowrap; }
    .stat span { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

    /* ---------- Списки ---------- */
    .list { display: grid; gap: 2px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 8px; margin: 0 -8px; border-radius: 12px; width: calc(100% + 16px); text-align: left; min-width: 0; }
    button.item:active, button.item:hover { background: var(--surface-2); }
    .item img.thumb { width: 72px; height: 44px; border-radius: 8px; object-fit: cover; background: #05060A; flex: none; }
    .item .thumb-ph { width: 72px; height: 44px; border-radius: 8px; background: var(--surface-2); flex: none; }
    .item-body { min-width: 0; flex: 1; }
    .item-title, .item-sub { display: block; }
    .item-title { font-weight: 580; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 650; background: var(--surface-3); color: var(--muted); }
    .badge.alarm { background: var(--alarm-bg); color: var(--alarm); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .badge.calm { background: var(--calm-bg); color: var(--calm); }
    .empty { color: var(--muted); padding: 10px 0; font-size: 14px; }
    .tech { color: var(--faint); font-size: 12px; text-align: center; }

    /* ---------- Настройки (лист) ---------- */
    .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(4, 5, 8, 0.66); backdrop-filter: blur(3px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .scrim > * { min-width: 0; justify-self: center; }
    .sheet {
      background: var(--surface); display: flex; flex-direction: column; min-height: 0;
      width: 100%; height: 100%; padding-top: var(--safe-t);
    }
    @media (min-width: 760px) {
      .scrim { place-items: center; padding: 24px; }
      .sheet { width: min(860px, 100%); height: min(760px, 100%); border-radius: 22px; border: 1px solid var(--line); padding-top: 0; overflow: hidden; }
    }
    .sheet-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .sheet-head h2 { margin: 0; font-size: 18px; flex: 1; }
    .tabs { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { min-height: 38px; padding: 0 14px; border-radius: 10px; white-space: nowrap; font-weight: 600; font-size: 14px; color: var(--muted); }
    .tab[aria-selected="true"] { background: var(--surface-3); color: var(--text); }
    .sheet-body { flex: 1; overflow-y: auto; padding: 16px 14px calc(24px + var(--safe-b)); display: grid; gap: 22px; align-content: start; -webkit-overflow-scrolling: touch; }
    .group h3 { margin: 0 0 4px; font-size: 16px; }
    .group > p { margin: 0 0 10px; color: var(--muted); font-size: 13.5px; }
    .rows { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .rowi { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; min-height: 56px; background: var(--surface-2); }
    .rowi + .rowi { border-top: 1px solid var(--line); }
    .rowi-body { flex: 1 1 170px; min-width: 0; }
    .rowi-title { font-weight: 580; }
    .rowi-sub { color: var(--muted); font-size: 12.5px; }
    .rowi-actions { display: flex; gap: 6px; flex: none; flex-wrap: wrap; justify-content: flex-end; }
    select, input[type="number"], input[type="text"] {
      min-height: 40px; padding: 0 10px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line); max-width: 100%;
    }
    input[type="number"] { width: 84px; }
    .faces { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .face { position: relative; width: 62px; height: 62px; }
    .face img { width: 100%; height: 100%; border-radius: 12px; object-fit: cover; background: var(--surface-3); }
    .face button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--alarm-strong); color: #fff; font-size: 13px; line-height: 22px; }
    .pair { display: grid; gap: 12px; justify-items: center; text-align: center; padding: 16px; border: 1px dashed var(--line-strong); border-radius: 14px; }
    .pair .qr { width: 216px; height: 216px; padding: 10px; background: #fff; color: #000; border-radius: 14px; }
    .pair .qr svg { width: 100%; height: 100%; display: block; }
    .pair code { font-size: 26px; font-weight: 700; letter-spacing: 0.14em; }
    .logrow { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
    .logrow time { color: var(--faint); flex: none; width: 62px; }
    .logrow.warning span, .logrow.critical span { color: var(--warn); }
    .logrow.critical span { color: var(--alarm); }

    /* ---------- Клип ---------- */
    .clip { background: var(--surface); width: 100%; height: 100%; display: flex; flex-direction: column; padding-top: var(--safe-t); }
    @media (min-width: 760px) { .clip { width: min(900px, 100%); height: auto; max-height: 100%; border-radius: 22px; border: 1px solid var(--line); overflow: hidden; padding-top: 0; } }
    .clip-media { background: #000; flex: 1; min-height: 0; display: grid; place-items: center; }
    .clip-media video, .clip-media img { width: 100%; max-height: 70vh; object-fit: contain; display: block; }
    .clip-foot { padding: 12px 14px calc(14px + var(--safe-b)); display: grid; gap: 10px; }

    .lock { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
    .lock-card { max-width: 380px; display: grid; gap: 14px; justify-items: center; }
    .lock-card h1 { margin: 0; font-size: 22px; }
    .toast {
      position: fixed; left: 50%; bottom: calc(22px + var(--safe-b)); transform: translate(-50%, 20px); z-index: 70;
      max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #F3F5F9; color: #10131A; font-weight: 560; font-size: 14px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15 9a4 4 0 0 1 0 6M17.8 6.5a8 8 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="m16 9.5 5 5m0-5-5 5"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.75 4.75 5.9v5.45c0 4.95 3.1 9.25 7.25 10.9 4.15-1.65 7.25-5.95 7.25-10.9V5.9L12 2.75Z"/><path d="M9.25 12.15 11.1 14l3.65-3.8"/></symbol>
    </defs>
  </svg>

  <div class="lock" id="lock" hidden>
    <div class="lock-card">
      <svg class="ico" style="width:44px;height:44px;color:var(--calm)"><use href="#i-shield"/></svg>
      <h1>Доступ только для семьи</h1>
      <p class="muted" id="lockText">Откройте пульт через кнопку «Пульт» в Telegram-боте или из приложения FallGuard.</p>
      <a class="btn primary big" id="lockLink" href="https://t.me/" target="_blank" rel="noopener">Открыть бота</a>
    </div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <div class="status" id="status" data-tone="offline" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <div class="status-text">
          <div class="status-title" id="statusTitle">Подключение…</div>

  /* ---------- Звук тревоги в браузере ---------- */

  /* ---------- Живое видео: fMP4 по WebSocket (MSE) с резервом MJPEG ---------- */

  const MSE = window.ManagedMediaSource || window.MediaSource || null;

  }
  function useMjpeg() {
    teardown(false);
    mjpeg = true;
    video.hidden = true;
    try { video.pause(); video.removeAttribute("src"); video.load(); } catch (_) {}
    img.hidden = false;
    img.src = withAuth("/api/mjpeg?overlay=0&t=" + Date.now());

  }
  function trimBuffer() {

  /* ---------- Разметка поверх видео ---------- */
  const canvas = $("overlay"), ctx = canvas.getContext("2d");

  const ROLE_COLOR = { patient: "#34D399", visitor: "#60A5FA", unknown: "#A3ABBA" };
  let rect = { x: 0, y: 0, w: 1, h: 1 }, rafPending = false;

  function srcSize() {
    const w = (!video.hidden && video.videoWidth) || (!img.hidden && img.naturalWidth) || cam.resolution[0] || 16;

        poly(draft, "#fff", "rgba(255,255,255,0.1)", false, draft.length > 2);
        draft.forEach((p, i) => {
          const [x, y] = px(p);
          ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fillStyle = "#fff"; ctx.fill();
          ctx.fillStyle = "#10131A"; ctx.font = "700 9px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(i + 1), x, y + 0.5); ctx.textAlign = "left";
        });
        return;
      }
      if (!showOverlay || !live) return;
      for (const t of live.tracks || []) {
        const b = t.bbox;
        if (!Array.isArray(b) || b.length < 4 || Number(t.track_id) < 0 || t.virtual_presence) continue;
        const color = ROLE_COLOR[t.role] || ROLE_COLOR.unknown;
        const [x1, y1] = px([b[0], b[1]]), [x2, y2] = px([b[2], b[3]]);
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(x1, y1, x2 - x1, y2 - y1, 8); ctx.stroke();
        if (!t.hide_skeleton && Array.isArray(t.keypoints)) {
          ctx.lineWidth = 1.6; ctx.globalAlpha = 0.75; ctx.beginPath();
          for (const [a, c] of EDGES) {
            const p = t.keypoints[a], q = t.keypoints[c];
            if (!p || !q || p[2] <= 0 || q[2] <= 0) continue;
            const [ax, ay] = px(p), [bx, by] = px(q);
            ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
          }
          ctx.stroke(); ctx.globalAlpha = 1;
        }
        label(x1, y1, t.role === "patient" ? "Бабушка" : t.role === "visitor" ? "Свой" : "Кто-то", color);
      }
    });
  }
  function toggleOverlay() {

  async function toggleFullscreen() {

  /* ---------- Рисование зон ---------- */
  const DRAW = {
    bed: ["Кровать: обведите матрас по углам", 3, "Контур кровати сохранён"],
    door: ["Дверь: обведите дверной проём", 3, "Контур двери сохранён"],
    floor: ["Пол: 4 угла прямоугольника на полу у кровати", 4, "Разметка пола сохранена"],
    ignore: ["Игнор-зона: обведите предмет, похожий на человека", 3, "Зона игнорирования добавлена"],
  };
  function startDraw(mode) {
    closeSheet();
    drawMode = mode; draft = [];
    viewport.classList.add("drawing");

    syncDrawBar();
    viewport.scrollIntoView({ block: "center", behavior: "smooth" });

  }
  function syncDrawBar() {
    if (!drawMode) return;

    $("drawHint").textContent = hint + " · точек: " + draft.length;
    $("btnSaveZone").disabled = draft.length < need;
  }
  function undoPoint() { draft.pop(); syncDrawBar(); draw(); }
  function cancelDraw() { drawMode = null; draft = []; viewport.classList.remove("drawing"); $("drawBar").hidden = true; draw(); }
  canvas.addEventListener("pointerdown", (e) => {
    if (!drawMode) return;
    e.preventDefault();
    if (drawMode === "floor" && draft.length >= 4) return;
    const r = canvas.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (e.clientX - r.left - rect.x) / rect.w));
    const y = Math.max(0, Math.min(1, (e.clientY - r.top - rect.y) / rect.h));
    draft.push([Math.round(x * 1e5) / 1e5, Math.round(y * 1e5) / 1e5]);
    haptic();
    syncDrawBar(); draw();
  });
  async function pushZones(payload, msg) {
    const d = await call("/api/zones", { json: payload }, msg);
    if (d && d.zones) { zones = d.zones; draw(); renderSheet(); }
    return d;
  }
  async function saveDraw() {
    const mode = drawMode, pts = draft.slice();
    if (!mode || pts.length < DRAW[mode][1]) return;
    const payload = mode === "bed" ? { bed_polygon: pts }
      : mode === "door" ? { door_polygon: pts }
      : mode === "floor" ? { floor_polygon: pts.slice(0, 4), floor_width_cm: zones.floor_width_cm, floor_depth_cm: zones.floor_depth_cm, mattress_height_cm: zones.mattress_height_cm }
      : { ignore_polygons: [...(zones.ignore_polygons || []), pts] };
    cancelDraw();
    await pushZones(payload, DRAW[mode][2]);
  }

  /* ---------- Быстрый статус (телеметрия ~12 Гц) ---------- */
  let tws = null, twsTimer = 0;
  function connectTelemetry() {
    if (!started || (tws && tws.readyState <= 1)) return;
    try { tws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + withAuth("/ws/telemetry")); } catch (_) { return; }
    tws.onmessage = (ev) => {
      let m = null; try { m = JSON.parse(ev.data); } catch (_) {}
      if (!m || !Array.isArray(m.tracks)) return;
      live = m;
      renderFast();
      draw();
    };
    tws.onclose = () => { tws = null; clearTimeout(twsTimer); twsTimer = setTimeout(connectTelemetry, 1500); };
  }
  function camOnline() { return Boolean(S && (S.camera_connected || (S.camera && S.camera.connected))); }
  function renderFast() {
    const src = live || S;
    if (!src || !S) return;
    const st = src.state || "idle", online = camOnline();
    let [title, tone] = STATE[st] || [st, "calm"];
    let sub = src.status_reason || "";
    if (sub.toLowerCase().startsWith(title.toLowerCase())) sub = sub.slice(title.length).replace(/^[\s·,—-]+/, "");
    if (!online) { title = "Нет связи с камерой"; tone = "offline"; sub = S && S.camera_configured === false ? "Укажите RTSP_URL в файле .env" : ((S && S.camera_error) || "Подключение к потоку…"); }
    else if (st === "paused" && src.pause_remaining_sec > 0) sub = "Тревоги не приходят ещё " + timer(src.pause_remaining_sec);
    else if (src.fall_unacknowledged && st !== "fallen") tone = "alarm";
    $("status").dataset.tone = tone;
    $("statusTitle").textContent = title;
    $("statusSub").textContent = sub ? sub.charAt(0).toUpperCase() + sub.slice(1) : " ";
    $("vpMsg").hidden = online;
    $("vpMsgSub").textContent = sub;

    const light = $("chipLight");
    light.hidden = !online;
    light.textContent = src.is_night_ir ? "Ночь · ИК" : "День";
    $("chipVisit").hidden = !src.door_visit_active;

    // Карточка тревоги
    const lvl = online ? alarmLevel(st, src.fall_unacknowledged) : "";
    const alarm = $("alarm");
    alarm.hidden = !lvl;
    if (lvl) {
      alarm.dataset.level = lvl;
      $("alarmTitle").textContent = lvl === "alarm" && st !== "fallen" ? "Тревога не подтверждена" : (STATE[st] || [st])[0];
      $("alarmDesc").textContent = sub ? sub.charAt(0).toUpperCase() + sub.slice(1) : "";
      $("alarmAck").className = "btn big " + (lvl === "alarm" ? "danger" : "primary");
    }
    // Основная кнопка охраны
    const slot = $("guardSlot");
    if (st === "paused") {

    } else if (lvl) {

    } else {
      setHtml(slot, `<div class="row"><button class="btn big" onclick="pauseGuard(900)">Я рядом · пауза 15 мин</button><button class="btn big" style="flex:0 0 auto" onclick="pauseGuard(3600)">1 час</button></div>`);
    }
    renderPeople(src.tracks || []);
    document.title = (lvl === "alarm" ? "🚨 " : "") + title + " — FallGuard";

  function renderPeople(tracks) {
    const src = live || S || {};
    const list = (tracks || []).filter((t) => t && t.role);
    if (!list.length) { setHtml($("people"), camOnline() ? `<span class="muted small" style="padding:6px 2px">В кадре никого не видно</span>` : ""); return; }
    let html = "";
    for (const t of list) {
      const id = Number(t.track_id), virtual = id < 0 || t.virtual_presence || !Array.isArray(t.bbox);

        html += `<div class="person-actions">` + (virtual

  function selectTrack(id) { selectedTrack = selectedTrack === id ? null : id; renderFast(); }

  /* ---------- Хроника ---------- */
  function setWindow(sec) {

  function renderTimeline(tl) {
    if (!tl) return;
    const start = tl.start_ts, win = tl.window_sec || windowSec;
    let html = `<u id="ribbonCursor"></u>`;
    for (const sp of tl.spans || []) {
      const l = Math.max(0, (sp.start - start) / win * 100), w = Math.min(100 - l, (sp.end - Math.max(sp.start, start)) / win * 100);
      if (w > 0) html += `<i class="t-${esc(sp.tone)}" style="left:${l.toFixed(3)}%;width:${Math.max(0.15, w).toFixed(3)}%"></i>`;
    }
    for (const c of clips) {
      const p = (c.ts - start) / win * 100;
      if (p >= 0 && p <= 100) html += `<b class="${c.state === "fallen" ? "fall" : ""}" style="left:${p.toFixed(3)}%"></b>`;
    }
    const rb = $("ribbon");
    if (rb._h !== html && !rb._hover) { rb._h = html; rb.innerHTML = html; }
    rb._tl = tl;
    const hrs = win / 3600, marks = [];
    for (let i = 0; i < 4; i++) marks.push(i === 3 ? "сейчас" : "−" + Math.round(hrs - (hrs / 3) * i) + " ч");
    setHtml($("axis"), marks.map((m) => `<span>${m}</span>`).join(""));
  }
  (function ribbonHover() {
    const rb = $("ribbon"), tip = $("tip");
    let thumbTimer = 0;
    function at(e) {
      const tl = rb._tl; if (!tl) return null;
      const r = rb.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      return { ts: tl.start_ts + f * tl.window_sec, f, r, tl };
    }
    function near(h) { const tol = h.tl.window_sec * 0.015; return clips.find((c) => Math.abs(c.ts - h.ts) <= tol); }
    function move(e) {
      const h = at(e); if (!h) return;
      rb._hover = true;
      const cur = $("ribbonCursor"); if (cur) { cur.style.display = "block"; cur.style.left = h.f * 100 + "%"; }
      const sp = (h.tl.spans || []).find((s) => h.ts >= s.start && h.ts <= s.end), clip = near(h);
      $("tipText").innerHTML = `<b class="num">${clock(h.ts)}</b> · ${esc(clip ? clip.title : sp ? sp.label : "нет данных")}`;
      tip.hidden = false;
      tip.style.left = Math.max(8, Math.min(window.innerWidth - 198, e.clientX - 95)) + "px";
      tip.style.top = Math.max(8, h.r.top - tip.offsetHeight - 10) + "px";
      clearTimeout(thumbTimer);
      thumbTimer = setTimeout(() => { $("tipImg").src = withAuth(clip && clip.jpg_url ? clip.jpg_url : "/api/timeline/thumb?ts=" + h.ts.toFixed(0)); }, 90);
    }
    function leave() { rb._hover = false; tip.hidden = true; const cur = $("ribbonCursor"); if (cur) cur.style.display = "none"; }
    rb.addEventListener("pointermove", move);
    rb.addEventListener("pointerdown", move);
    rb.addEventListener("pointerleave", leave);
    rb.addEventListener("pointercancel", leave);
    rb.addEventListener("click", (e) => { const h = at(e); const c = h && near(h); if (c) openClip(c.id); });
    $("tipImg").addEventListener("error", () => { $("tipImg").removeAttribute("src"); });
  })();

      return `<div class="rowi" style="flex-wrap:wrap"><div class="rowi-body"><div class="rowi-title">${esc(d.name)}${mine ? ' <span class="badge calm">этот телефон</span>' : ""}</div><div class="rowi-sub">${d.last_seen ? "на связи " + ago(d.last_seen) : "ещё не выходил на связь"}</div></div>
        <div class="rowi-actions">${modeSeg(d.mode, `(m=>patchDevice('${id}',{mode:m}))`)}${sw(d.enabled, `patchDevice('${id}',{enabled:${!d.enabled}})`, "Тревоги")}<button class="btn sm ghost red-text" onclick="removeDevice('${id}')" aria-label="Отвязать">✕</button></div></div>`;
    }).join("") + `</div>`;
    if (pairInfo) {
      h += `<div class="pair" style="margin-top:10px"><div class="qr">${pairInfo.qr_svg}</div><div><div class="muted small">Код привязки</div><code class="num">${esc(pairInfo.code)}</code></div>
        <div class="small muted">В приложении нажмите «Сканировать QR» или введите адрес <b style="color:var(--text)">${esc(pairInfo.server_url)}</b> и этот код.<br>Код действует ещё <span class="num" id="pairLeft"></span>.</div></div>`;
    } else h += `<button class="btn block" style="margin-top:10px" onclick="pairPhone()">Подключить телефон</button>`;
    if (native) h += `<button class="btn block" style="margin-top:8px" onclick="FallGuardAndroid.openAppSettings()">Настройки приложения на этом телефоне</button>`;
    return h + `</div>`;
  }
  async function setSubMode(cid, mode) { if (await call("/api/subscribers/" + encodeURIComponent(cid) + "/mode", { json: { mode } })) await refreshMe(); }
  async function toggleSub(cid) { if (await call("/api/subscribers/" + encodeURIComponent(cid) + "/toggle", { method: "POST" })) poll(); }
  async function removeSub(cid) { if (confirm("Отключить этот чат от тревог?") && await call("/api/subscribers/" + encodeURIComponent(cid), { method: "DELETE" }, "Чат отключён")) poll(); }
  async function testTelegram() { const d = await call("/api/test-telegram", { method: "POST" }); if (d) toast(d.message || "Отправлено"); }
  async function patchDevice(id, patch) { if (await call("/api/devices/" + encodeURIComponent(id), { json: patch })) await refreshMe(); }
  async function removeDevice(id) { if (confirm("Отвязать этот телефон? Тревоги на него приходить перестанут.") && await call("/api/devices/" + encodeURIComponent(id), { method: "DELETE" }, "Телефон отвязан")) poll(); }
  async function pairPhone() {
    const d = await call("/api/devices/pair-code", { method: "POST" });
    if (!d) return;
    pairInfo = d; pairInfo.until = Date.now() + d.expires_in * 1000;
    renderSheet();
    clearInterval(pairTimer);
    pairTimer = setInterval(() => {
      const left = Math.round((pairInfo.until - Date.now()) / 1000);
      if (left <= 0) { clearInterval(pairTimer); pairInfo = null; renderSheet(); return; }
      const el = $("pairLeft"); if (el) el.textContent = timer(left);
    }, 1000);
  }

  function tabZones() {
    const z = zones, has = (p, n) => Array.isArray(p) && p.length >= n;
    const zrow = (mode, title, sub, ok, clearPayload) => `<div class="rowi"><div class="rowi-body"><div class="rowi-title">${title} ${ok ? '<span class="badge calm">задана</span>' : '<span class="badge warn">не задана</span>'}</div><div class="rowi-sub">${sub}</div></div>
      <div class="rowi-actions">${ok && clearPayload ? `<button class="btn sm ghost" onclick='clearZone(${JSON.stringify(clearPayload)})'>Убрать</button>` : ""}<button class="btn sm" onclick="startDraw('${mode}')">${ok ? "Перерисовать" : "Нарисовать"}</button></div></div>`;
    const ig = (z.ignore_polygons || []).length;
    let h = `<div class="group"><h3>Зоны на видео</h3><p>Кровать обязательна: по ней система понимает, где бабушка лежит, а где пол. Дверь помогает отличать вошедших родственников.</p><div class="rows">`
      + zrow("bed", "Кровать", "Обведите матрас по углам", has(z.bed_polygon, 3), null)
      + zrow("door", "Дверь", "Кто вошёл через дверь — тот «свой»", has(z.door_polygon, 3), { door_polygon: [] })
      + zrow("floor", "Пол у кровати", "4 точки — для оценки роста и расстояний", has(z.floor_polygon, 4), { floor_polygon: [] })
      + `<div class="rowi"><div class="rowi-body"><div class="rowi-title">Игнор-зоны ${ig ? `<span class="badge">${ig}</span>` : ""}</div><div class="rowi-sub">Вешалка, халат на стуле, зеркало — что система принимает за человека</div></div>
        <div class="rowi-actions">${ig ? `<button class="btn sm ghost" onclick="clearIgnore()">Убрать все</button>` : ""}<button class="btn sm" onclick="startDraw('ignore')">Добавить</button></div></div></div></div>`;
    if (has(z.floor_polygon, 4)) h += `<div class="group"><h3>Размеры в сантиметрах</h3><p>Реальные размеры размеченного прямоугольника пола и высота матраса.</p><div class="rows">
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Ширина</div></div><input type="number" id="inFloorW" min="40" max="1000" value="${Math.round(z.floor_width_cm)}" /></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Глубина</div></div><input type="number" id="inFloorD" min="40" max="1000" value="${Math.round(z.floor_depth_cm)}" /></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Высота матраса</div></div><input type="number" id="inMatH" min="15" max="140" value="${Math.round(z.mattress_height_cm)}" /></div>
      </div><button class="btn block" style="margin-top:10px" onclick="saveDims()">Сохранить размеры</button></div>`;
    const rot = Number(cam.rotate) || 0;
    h += `<div class="group"><h3>Камера</h3><div class="rows">
        <div class="rowi" style="flex-wrap:wrap"><div class="rowi-body"><div class="rowi-title">Поворот кадра</div></div><div class="seg">${[0, 90, 180, 270].map((r) => `<button aria-pressed="${rot === r}" onclick="setCam({rotate:${r}})">${r}°</button>`).join("")}</div></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Зеркально</div></div>${sw(cam.flip_h, `setCam({flip_h:${!cam.flip_h}})`, "Зеркально")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Осветлять тёмный кадр</div><div class="rowi-sub">Помогает видеть ночью и в сумерках</div></div>${sw(cam.enhance, `setCam({enhance:${!cam.enhance}})`, "Осветление")}</div>
      </div></div>`;
    return h;
  }
  async function clearZone(payload) { if (confirm("Убрать эту зону?")) await pushZones(payload, "Зона убрана"); }
  async function clearIgnore() { if (!confirm("Убрать все игнор-зоны?")) return; const d = await call("/api/zones/ignore", { method: "DELETE" }, "Игнор-зоны убраны"); if (d && d.zones) { zones = d.zones; draw(); renderSheet(); } }
  async function saveDims() {
    const clamp = (id, lo, hi, def) => Math.max(lo, Math.min(hi, Number($(id).value) || def));
    await pushZones({ floor_width_cm: clamp("inFloorW", 40, 1000, 200), floor_depth_cm: clamp("inFloorD", 40, 1000, 120), mattress_height_cm: clamp("inMatH", 15, 140, 55) }, "Размеры сохранены");
  }
  async function setCam(patch) { const d = await call("/api/camera", { json: patch }); if (d) { cam = Object.assign(cam, d.camera || d); layout(); renderSheet(); } }

  function tabPeople() {
    const faces = S.faces || {}, tracks = (live && live.tracks) || S.tracks || [];
    const gal = (role, title, sub) => {
      const arr = faces[role] || [];
      return `<div class="group"><h3>${title}</h3><p>${sub}</p>
        <div class="faces">${arr.map((fn) => `<span class="face"><img loading="lazy" alt="" src="${esc(withAuth("/api/faces/" + role + "/photo/" + encodeURIComponent(fn)))}" /><button onclick="removeFace('${role}','${esc(fn)}')" aria-label="Удалить фото">✕</button></span>`).join("") || `<span class="muted small">Фото пока нет</span>`}</div>
        <div class="row"><button class="btn" onclick="captureFace('${role}')">Снять с камеры сейчас</button><label class="btn">Загрузить фото<input type="file" accept="image/*" hidden onchange="uploadFace('${role}',this)" /></label></div></div>`;
    };
    let h = `<div class="group"><h3>Кто сейчас в кадре</h3><p>Если система перепутала — поправьте: она запомнит одежду и лицо.</p>`;
    const real = tracks.filter((t) => Number(t.track_id) >= 0 && !t.virtual_presence && Array.isArray(t.bbox));
    h += real.length ? `<div class="rows">` + real.map((t) => {
      const id = Number(t.track_id);
      return `<div class="rowi" style="flex-wrap:wrap"><div class="rowi-body"><div class="rowi-title">${t.role === "patient" ? "Бабушка" : t.role === "visitor" ? "Свой" : "Не определён"}</div><div class="rowi-sub">${esc(t.reason_ru || "")}</div></div>
        <div class="rowi-actions"><button class="btn sm" aria-pressed="${t.role === "patient"}" onclick="assign(${id},'patient')">Бабушка</button><button class="btn sm" aria-pressed="${t.role === "visitor"}" onclick="assign(${id},'visitor')">Свой</button><button class="btn sm ghost" onclick="ignoreThing(${id})">Вещь</button></div></div>`;
    }).join("") + `</div>` : `<div class="empty">В кадре никого не видно</div>`;
    const flags = [];
    if (S.door_visit_active) flags.push(`<div class="rowi"><div class="rowi-body"><div class="rowi-title">Отмечен визит родственника</div><div class="rowi-sub">Пока идёт визит, посадка и выход из кровати не сигналят</div></div><button class="btn sm" onclick="act('/api/door_visit/clear','Отмечено: родственник вышел')">Он вышел</button></div>`);
    if (S.patient_in_bed_latched) flags.push(`<div class="rowi"><div class="rowi-body"><div class="rowi-title">Считается, что бабушка в кровати</div><div class="rowi-sub">Даже если под одеялом её не видно</div></div><button class="btn sm" onclick="act('/api/bed_presence/clear','Отмечено: в кровати никого нет')">Её там нет</button></div>`);
    if (flags.length) h += `<div class="rows" style="margin-top:10px">${flags.join("")}</div>`;
    h += `</div>`
      + gal("patient", "Фото бабушки", "2–4 фото лица анфас и вполоборота. Главный способ не путать её с родственниками.")
      + gal("visitor", "Фото своих", "Родственники и сиделка. Когда они рядом, система не поднимает тревогу о подъёме.")
      + `<div class="group"><h3>Если роли путаются постоянно</h3><p>Сброс заставит систему заново запомнить, как выглядит бабушка и в какой позе она спит.</p><div class="row"><button class="btn" onclick="act('/api/reset-anchor','Память о внешности сброшена')">Забыть внешность</button><button class="btn" onclick="act('/api/recalibrate-baseline','Поза сна будет снята заново')">Переснять позу сна</button></div></div>`;
    return h;
  }
  async function captureFace(role) { if (await call("/api/faces/" + role + "/from-camera", { json: {} }, "Лицо сохранено")) poll(); }
  async function uploadFace(role, input) {
    if (!input.files || !input.files[0]) return;
    const fd = new FormData(); fd.append("file", input.files[0]);
    input.value = "";
    if (await call("/api/faces/" + role, { method: "POST", body: fd }, "Фото добавлено")) poll();
  }
  async function removeFace(role, fn) { if (await call("/api/faces/" + role + "/" + encodeURIComponent(fn), { method: "DELETE" })) poll(); }

  function tabCare() {
    const p = S.prefs || {}, diag = (S.care && S.care.diagnostics) || {};
    const preset = p.sensitivity_preset || "standard";
    const opt = (cur, list) => list.map(([v, l]) => `<option value="${v}" ${Number(cur) === v ? "selected" : ""}>${l}</option>`).join("");
    return `<div class="group"><h3>Как быстро поднимать тревогу</h3><p>«Быстро» — раньше предупреждает, но чаще ошибается. «Спокойно» — реже беспокоит по пустякам.</p>
        <div class="seg wide">${[["high", "Быстро"], ["standard", "Обычно"], ["gentle", "Спокойно"]].map(([v, l]) => `<button aria-pressed="${preset === v}" onclick="setPrefs({sensitivity_preset:'${v}'})">${l}</button>`).join("")}</div>
        <div class="muted small" style="margin-top:8px">Падение подтверждается за ${esc(p.fall_confirm_seconds)} с, посадка — за ${esc(diag.effective_sit_confirm_sec ?? p.sit_confirm_seconds)} с${diag.night_active ? " (сейчас ночной режим)" : ""}</div></div>
      <div class="group"><h3>О чём сигналить</h3><div class="rows">
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Любой человек на полу</div><div class="rowi-sub">Тревога, если кто-то неподвижно лежит на полу и рядом никого — даже если система не узнала бабушку</div></div>${sw(p.floor_safety_net !== false, `setPrefs({floor_safety_net:${p.floor_safety_net === false}})`, "Любой человек на полу")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Поднятая рука — зов на помощь</div><div class="rowi-sub">Если бабушка держит руку над головой ${esc(p.help_confirm_seconds)} с</div></div>${sw(p.enable_help_gesture, `setPrefs({enable_help_gesture:${!p.enable_help_gesture}})`, "Жест рукой")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Ночью реагировать быстрее</div><div class="rowi-sub">С ${pad(p.night_start_hour ?? 22)}:00 до ${pad(p.night_end_hour ?? 7)}:00</div></div>${sw(p.night_strict_mode, `setPrefs({night_strict_mode:${!p.night_strict_mode}})`, "Ночной режим")}</div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Долго нет в кровати</div><div class="rowi-sub">Повторная тревога, если не вернулась</div></div><select onchange="setPrefs({prolonged_absence_minutes:Number(this.value)})">${opt(p.prolonged_absence_minutes, [[0, "Выкл"], [10, "10 мин"], [15, "15 мин"], [20, "20 мин"], [30, "30 мин"], [45, "45 мин"], [60, "1 час"]])}</select></div>
        <div class="rowi"><div class="rowi-body"><div class="rowi-title">Напоминать сменить позу</div><div class="rowi-sub">Профилактика пролежней</div></div><select onchange="setPrefs({immobility_reminder_minutes:Number(this.value)})">${opt(p.immobility_reminder_minutes, [[0, "Выкл"], [120, "Каждые 2 ч"], [180, "Каждые 3 ч"], [240, "Каждые 4 ч"]])}</select></div>
      </div><p class="muted small" style="margin-top:8px">Режим «только падение и сползание» каждый получатель включает себе сам — на главном экране или во вкладке «Кому сигналить».</p></div>`;
  }
  async function setPrefs(patch) { const d = await call("/api/prefs", { json: patch }); if (d && S) { S.prefs = d.prefs; S.care = d.care || S.care; renderSheet(); } }

  function tabJournal() {
    const evs = (S.events || []).filter((e) => logFilter === "all" || e.category === logFilter);
    const st = S.clips_stats || {};
    return `<div class="group"><div class="row" style="align-items:center;margin-bottom:8px"><div class="seg">${[["all", "Всё"], ["alert", "Тревоги"], ["system", "Система"]].map(([v, l]) => `<button aria-pressed="${logFilter === v}" onclick="logFilter='${v}';renderSheet()">${l}</button>`).join("")}</div></div>
      ${evs.length ? evs.slice(0, 120).map((e) => `<div class="logrow ${esc(e.level)}"><time class="num" title="${esc(e.date)}">${esc((e.time || "").slice(0, 5))}</time><span style="flex:1;min-width:0">${esc(e.text)}</span>${e.clip_id && clips.some((c) => c.id === e.clip_id) ? `<button class="btn sm ghost" onclick="openClip('${esc(e.clip_id)}')">Запись</button>` : ""}</div>`).join("") : `<div class="empty">Записей нет</div>`}</div>
      <div class="group"><h3>Архив записей</h3><p>${st.count || 0} записей · ${Number(st.used_mb || 0).toFixed(1)} из ${st.max_total_mb || 250} МБ. Старые удаляются автоматически.</p><button class="btn red-text" onclick="clearArchive()">Очистить архив</button></div>`;
  }
  function renderSheet() {
    if ($("sheetScrim").hidden || !S) return;
    const active = document.activeElement;
    if (active && $("sheetBody").contains(active) && /^(INPUT|SELECT)$/.test(active.tagName)) return;
    const html = ({ recipients: tabRecipients, zones: tabZones, people: tabPeople, care: tabCare, journal: tabJournal }[activeTab] || tabRecipients)();
    setHtml($("sheetBody"), html);
  }

  /* ---------- Опрос и запуск ---------- */
  async function refreshMe() {
    try {
      const r = await api("/api/me");
      if (r.ok) { const d = await r.json(); if (d.me && d.me.kind !== "lan") me = d.me; else if (d.me) me = Object.assign(d.me, { mode: lsGet("fg_mode", "all") }); }
    } catch (_) {}
    renderMode();
    await poll();
  }
  let pollBusy = false;
  async function poll() {
    if (!started || pollBusy) return;
    pollBusy = true;
    try {
      const r = await api("/api/status?window_sec=" + windowSec);
      if (r.status === 401) { showLock(); return; }
      if (!r.ok) return;
      S = await r.json();
      if (S.zones && !drawMode) zones = S.zones;
      if (S.camera) cam = Object.assign(cam, S.camera);
      clips = S.recent_clips || [];
      if (!live || !tws || tws.readyState !== 1) live = Object.assign({}, S);
      if (me.kind === "telegram") { const mine = (S.telegram_subscribers || []).find((s) => String(s.chat_id) === me.id); if (mine) { me.mode = mine.mode; me.enabled = mine.enabled; } }
      if (me.kind === "device") { const mine = (S.devices || []).find((d) => d.id === me.id); if (mine) { me.mode = mine.mode; me.enabled = mine.enabled; } }
      renderMode(); renderFast(); renderTimeline(S.timeline); renderStats(S.care); renderEvents(); renderSheet(); draw();
      $("tech").textContent = [S.runtime, (S.infer_fps || 0).toFixed(1) + " кадр/с", cam.resolution && cam.resolution[0] ? cam.resolution.join("×") : "", mjpeg ? "MJPEG" : "H.264"].filter(Boolean).join(" · ");
      if (pendingClip && clips.some((c) => c.id === pendingClip)) { const id = pendingClip; pendingClip = ""; openClip(id); }
    } catch (_) {} finally { pollBusy = false; }
  }

  function showLock(text, bot) {
    const b = String(bot || (S && S.telegram_bot_username) || "").replace(/^@+/, "");
    if (text) $("lockText").textContent = text;
    $("lockLink").href = "https://t.me/" + encodeURIComponent(b);
    $("lockLink").hidden = !b;
    $("lock").hidden = false;
    $("app").hidden = true;
  }
  function syncBack() {
    const t = tg(); if (!t || !t.BackButton) return;
    try { ($("sheetScrim").hidden && $("clipScrim").hidden) ? t.BackButton.hide() : t.BackButton.show(); } catch (_) {}
  }
  function goBack() {
    if (!$("clipScrim").hidden) { closeClip(); return true; }
    if (!$("sheetScrim").hidden) { closeSheet(); return true; }
    if (drawMode) { cancelDraw(); return true; }
    return false;
  }
  window.fallguardBack = goBack; // Android: кнопка «Назад»
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") goBack(); });

  let pendingClip = "";
  async function start(startParam) {
    if (started) return;
    started = true;
    $("lock").hidden = true; $("app").hidden = false;
    const sp = String(startParam || "");
    if (sp.startsWith("clip_")) pendingClip = sp.slice(5);
    [...$("winSeg").children].forEach((b, i) => b.setAttribute("aria-pressed", String((i === 0) === (windowSec === 21600))));
    $("btnOverlay").setAttribute("aria-pressed", String(showOverlay));
    syncSoundBtn();
    startStream(true);
    connectTelemetry();
    await refreshMe();
    setInterval(poll, 2500);
    if ("serviceWorker" in navigator && !tg()?.initData && !native) navigator.serviceWorker.register("/sw.js").catch(() => {});
  }
  async function boot() {
    const params = new URLSearchParams(location.search);
    const t = tg(), initData = (t && typeof t.initData === "string") ? t.initData.trim() : "";
    if (initData) {
      try { t.ready(); t.expand(); t.setHeaderColor("#0A0C10"); t.setBackgroundColor("#0A0C10"); t.disableVerticalSwipes && t.disableVerticalSwipes(); t.BackButton && t.BackButton.onClick(goBack); } catch (_) {}
      try {
        const r = await fetch("/api/tg/auth", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ init_data: initData }) });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.authenticated !== false) { token = String(d.session_token || ""); return start(d.start_param || (t.initDataUnsafe && t.initDataUnsafe.start_param) || ""); }
        return showLock(d.detail || "Доступ к пульту есть только у участников семейного бота.", d.bot_username);
      } catch (_) { return showLock("Не удалось проверить вход через Telegram. Проверьте связь и откройте пульт заново."); }
    }
    try {
      const r = await fetch("/api/tg/session", { credentials: "same-origin" });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.authenticated === false) return showLock("", d.bot_username);
      if (r.status === 401 || r.status === 403) return showLock(d.detail || "", d.bot_username);
      token = String(d.session_token || "");
    } catch (_) {}
    start(params.get("tgWebAppStartParam") || params.get("clip") || "");
  }
  boot();
  </script>
</body>
</html>
